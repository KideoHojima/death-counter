<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Death Counter</title>
<link rel="icon" href="data:,">
<!--
  Twitch Death Counter — OBS Browser Source widget
  ------------------------------------------------
  Hosted: https://kideohojima.github.io/death-counter/?channel=yourchannel
  Local: OBS → Sources → + → Browser → tick "Local file" → pick this file.
  OBS's local-file mode can't take ?query params, so set CONFIG below.
  If you host the file on a web server instead, URL params override CONFIG:
    death-counter.html?channel=yourchannel&cmd=deathcount&label=Deaths
  Appearance params: size, color, num, stroke, outline, shadow=0, font
  Easiest: build the URL with control.html (the control panel).

  Chat commands (only the broadcaster and moderators):
    !deathcount 10      set to 10
    !deathcount +       +1
    !deathcount -       -1
    !deathcount +5 / -3 add or subtract a number
    !deathcount reset   back to 0
-->
<style>
  html, body {
    margin: 0;
    background: transparent;   /* lets OBS show only the text */
    overflow: hidden;
  }
  #counter {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    gap: 0.4em;
    padding: 0.2em 0.5em;
    font: 800 64px/1.1 "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
    color: #fff;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    text-shadow: 0 3px 6px rgba(0,0,0,.6);
    transform-origin: left center;
  }
  #value { color: #ff4d4d; min-width: 1ch; display: inline-block; }
  .bump  { animation: bump 400ms ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  #status {
    position: fixed; bottom: 2px; left: 4px;
    font: 700 14px monospace; color: #fff;
    -webkit-text-stroke: 1px #000;
    paint-order: stroke fill;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
  <div id="counter"><span id="label">💀 Deaths:</span><span id="value">0</span></div>
  <div id="status"></div>

<script>
// ===== CONFIG (edit these) ==================================================
const CONFIG = {
  channel: "yourchannel",   // Twitch channel name, lowercase, no #
  cmd: "deathcount",        // command word without "!"
  label: "💀 Deaths:",      // text shown before the number
  allowVIP: false,          // let VIPs use the command too
  showStatus: true          // small connection text at bottom-left (hides once connected)
};
// ============================================================================

const params  = new URLSearchParams(location.search);
const channel = (params.get("channel") || CONFIG.channel).toLowerCase().replace(/^#/, "");
const cmd     = (params.get("cmd") || CONFIG.cmd).toLowerCase().replace(/^!/, "");
const label   = params.has("label") ? params.get("label") : CONFIG.label;
const allowVIP = params.has("vip") ? params.get("vip") === "1" : CONFIG.allowVIP;
const debug   = params.get("debug") === "1";   // ?debug=1 shows every chat line the widget receives
const storeKey = `deathcount:${channel}:${cmd}`;

const $value  = document.getElementById("value");
const $label  = document.getElementById("label");
const $status = document.getElementById("status");
const $counter = document.getElementById("counter");
$label.textContent = label;

// ---- appearance (optional URL params; the control panel builds these) ----
//   size=64  color=ffffff  num=ff4d4d  stroke=000000  outline=2  shadow=0  font=Segoe UI
function colorParam(name) {
  const v = params.get(name);
  if (!v) return null;
  const c = "#" + v.replace(/^#/, "");
  return /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c) ? c : null;
}
const size = parseInt(params.get("size"), 10);
if (size >= 8 && size <= 400) $counter.style.fontSize = size + "px";
const textColor = colorParam("color");
if (textColor) $counter.style.color = textColor;
const numColor = colorParam("num");
if (numColor) $value.style.color = numColor;
if (params.has("stroke") || params.has("outline")) {
  const w = params.has("outline") ? Math.max(0, Math.min(20, parseFloat(params.get("outline")) || 0)) : 2;
  $counter.style.webkitTextStroke = w + "px " + (colorParam("stroke") || "#000");
}
if (params.get("shadow") === "0") $counter.style.textShadow = "none";
const font = (params.get("font") || "").replace(/[^\w \-]/g, "").trim();
if (font) $counter.style.fontFamily = `"${font}", "Segoe UI", "Noto Sans Thai", system-ui, sans-serif`;

// ---- preview mode (used by control.html) ----
// preview=1: no chat connection and nothing saved; the panel sends the number
// to show via postMessage({ type: "deathcount", count }).
const preview = params.get("preview") === "1";

// ---- persistence ----
// Saved in the browser source's localStorage under a key per channel + command,
// so each streamer keeps their own count across OBS restarts and streams.
// It lives on this PC only (another PC / OBS install starts from its own count).
function load() {
  if (preview) return parseInt(params.get("value"), 10) || 0;
  try { return parseInt(localStorage.getItem(storeKey), 10) || 0; } catch (e) { return 0; }
}
function save(n) {
  if (preview) return;
  try { localStorage.setItem(storeKey, String(n)); } catch (e) {}
}

let count = load();
render(false);

function render(animate = true) {
  $value.textContent = count;
  if (animate) {
    $counter.classList.remove("bump");
    void $counter.offsetWidth;          // restart animation
    $counter.classList.add("bump");
  }
}
function setCount(n) {
  n = Math.max(0, Math.min(999999, Math.trunc(n)));
  if (n === count) return;
  count = n; save(n); render();
}
function status(text) {
  $status.textContent = (CONFIG.showStatus || debug) ? text : "";
}
function log(text) {
  console.log("[deathcount]", text);
  if (debug) status(text);
}

// Chat clients (7TV, Chatterino, Twitch's duplicate-message bypass) can append
// invisible characters such as U+E0000 or U+034F. Strip them before matching.
function clean(text) {
  return text.replace(/[\u{E0000}-\u{E007F}\u034F\u00AD\u180E\u200B-\u200F\u2060-\u2064\uFEFF]/gu, "").trim();
}

// ---- command handling ----
function handleCommand(arg) {
  arg = (arg || "").trim().toLowerCase();
  if (arg === "") return;                                   // bare "!deathcount": ignore
  if (arg === "+")                                      return setCount(count + 1);
  if (arg === "-")                                      return setCount(count - 1);
  if (arg === "reset")                                  return setCount(0);
  if (/^[+-]\d+$/.test(arg))                            return setCount(count + parseInt(arg, 10));
  if (/^\d+$/.test(arg))                                return setCount(parseInt(arg, 10));
}

function isPrivileged(tags) {
  const badges = tags["badges"] || "";
  if (/(^|,)broadcaster\//.test(badges)) return true;
  if (tags["mod"] === "1" || /(^|,)moderator\//.test(badges)) return true;
  if (allowVIP && /(^|,)vip\//.test(badges)) return true;
  return false;
}

// ---- Twitch IRC (anonymous, read-only) ----
function parseLine(line) {
  // @tags :nick!nick@nick.tmi.twitch.tv PRIVMSG #channel :message
  let tags = {}, rest = line;
  if (rest.startsWith("@")) {
    const sp = rest.indexOf(" ");
    for (const pair of rest.slice(1, sp).split(";")) {
      const eq = pair.indexOf("=");
      tags[pair.slice(0, eq)] = pair.slice(eq + 1);
    }
    rest = rest.slice(sp + 1);
  }
  const m = rest.match(/^:(\S+?)!\S+ PRIVMSG #(\S+) :(.*)$/);
  if (!m) return null;
  return { tags, user: m[1], channel: m[2], text: m[3] };
}

const cmdRe = new RegExp(`^!${cmd.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?:\\s+(.*))?$`, "i");
let ws = null, retry = 0, joined = false, lastSeen = 0, reconnectTimer = null, hideTimer = null;

// Tear down the current socket (if any) and schedule exactly one reconnect.
function reconnect(reason) {
  if (reconnectTimer) return;                    // already scheduled
  if (ws) {
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch (e) {}
    ws = null;
  }
  joined = false;
  const delay = Math.min(30000, 1000 * Math.pow(2, retry++));
  status(`${reason} — retrying in ${Math.round(delay / 1000)}s`);
  log(`${reason}; reconnecting in ${delay} ms`);
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay);
}

function connect() {
  status("connecting…");
  lastSeen = Date.now();
  const sock = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws = sock;

  sock.onopen = () => {
    sock.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    sock.send("PASS SCHMOOPIIE");                                 // any value works for anonymous
    sock.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
    sock.send("JOIN #" + channel);
  };

  sock.onmessage = (ev) => {
    lastSeen = Date.now();
    for (const line of ev.data.split("\r\n")) {
      if (!line) continue;
      if (line.startsWith("PING")) { sock.send("PONG" + line.slice(4)); continue; }
      if (/ 366 /.test(line)) {                                       // end of JOIN = connected
        retry = 0; joined = true;
        status(`connected to #${channel}`);
        clearTimeout(hideTimer);
        if (!debug) hideTimer = setTimeout(() => { if (joined) status(""); }, 5000);
        continue;
      }
      if (/^(?:@\S+ )?:tmi\.twitch\.tv RECONNECT\b/.test(line)) { reconnect("Twitch asked to reconnect"); return; }
      const msg = parseLine(line);
      if (!msg) continue;
      const text = clean(msg.text);
      const hit = text.match(cmdRe);
      if (!hit) { log(`${msg.user}: ${text}  (not a !${cmd} command)`); continue; }
      if (!isPrivileged(msg.tags)) { log(`${msg.user}: ${text}  (ignored: not broadcaster/mod)`); continue; }
      handleCommand(hit[1]);
      log(`${msg.user}: ${text}  → ${count}`);
    }
  };

  sock.onclose = () => reconnect("disconnected");
  sock.onerror = () => reconnect("connection error");
}

// Watchdog. A WebSocket can die silently (Wi-Fi blip, PC sleep, Twitch dropping
// the link) without the browser ever firing onclose — the widget would then
// wait forever. So: if joining takes >15 s, or nothing at all arrives for 75 s,
// treat the connection as dead. While idle we PING every 30 s so a healthy
// connection always has traffic (Twitch answers with PONG).
if (preview) {
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data;
    if (d && d.type === "deathcount" && typeof d.count === "number") setCount(d.count);
  });
} else {
  connect();
  setInterval(() => {
    if (!ws || reconnectTimer) return;
    const idle = Date.now() - lastSeen;
    if (!joined && idle > 15000) return reconnect("connect timed out");
    if (idle > 75000)            return reconnect("connection went quiet");
    if (idle > 30000 && ws.readyState === 1) ws.send("PING :deathcount");
  }, 10000);
}
</script>
</body>
